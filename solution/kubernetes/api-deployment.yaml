# Illustrative production-ready API Deployment.
# Assumptions to verify before use:
# - Namespace is `app` .
# - The API listens on port 8080 and implements the three health endpoints below.
# - The image is pushed to Artifact Registry and is deployed by immutable digest.
# - The GKE Standard regional cluster has eligible nodes in all intended zones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey-api
  namespace: app
  labels:
    app: survey-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: survey-api
  template:
    metadata:
      labels:
        app: survey-api
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: survey-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: survey-api
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/api@sha256:REPLACE_WITH_REAL_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # The application must handle SIGTERM: stop accepting new work,
          # drain in-flight requests, and close DB connections before exit.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: survey-api
  namespace: app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: survey-api
